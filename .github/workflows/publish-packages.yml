name: Publish packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semver already present in every public package manifest
        required: true
        type: string
  push:
    tags:
      - "packages-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.7.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@50d5a8956f2e319df19e6b57539d7e2acb9f8c1e # v1.5.0
        with:
          version: v1.7.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@12.0.1

      - name: Resolve requested version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#packages-v}"
          else
            version="${INPUT_VERSION}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid exact semver: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify package versions and release metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: pnpm exec tsx scripts/validate-package-release.ts

      - name: Validate project and dependency pins
        run: |
          pnpm dependencies:validate
          pnpm normalization:validate
          pnpm manifest:v3:draft
          pnpm contracts:build
          pnpm contracts:abi:v3
          pnpm artifacts:v3:check
          pnpm project:validate
          pnpm exec tsx scripts/validate-integration-artifacts.ts

      - name: Build, lint, typecheck and test
        run: |
          pnpm build
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Pack public workspaces
        run: |
          mkdir package-tarballs
          pnpm --filter @sepbase/sdk pack --pack-destination "$GITHUB_WORKSPACE/package-tarballs"
          pnpm --filter @sepbase/react pack --pack-destination "$GITHUB_WORKSPACE/package-tarballs"
          pnpm --filter @sepbase/mcp pack --pack-destination "$GITHUB_WORKSPACE/package-tarballs"

      - name: Publish SDK with npm provenance
        run: npm publish "package-tarballs/sepbase-sdk-${{ steps.release.outputs.version }}.tgz" --access public --provenance

      - name: Publish React package with npm provenance
        run: npm publish "package-tarballs/sepbase-react-${{ steps.release.outputs.version }}.tgz" --access public --provenance

      - name: Publish MCP package with npm provenance
        run: npm publish "package-tarballs/sepbase-mcp-${{ steps.release.outputs.version }}.tgz" --access public --provenance
