name: Verify hosted release

on:
  workflow_dispatch:
    inputs:
      origin:
        description: Exact HTTPS origin to verify
        required: true
        type: string
      expectation:
        description: Expected V3 release state
        required: true
        default: live
        type: choice
        options:
          - live
          - draft

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: hosted-release
    steps:
      - name: Check out the reviewed release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.7.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify final-origin parity and protocol surfaces
        env:
          HOSTED_RELEASE_ORIGIN: ${{ inputs.origin }}
          HOSTED_RELEASE_EXPECTATION: ${{ inputs.expectation }}
          HOSTED_RELEASE_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm hosted:check
