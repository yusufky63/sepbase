name: Release public packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semver already present in all three package manifests
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-production
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish SDK, React, and MCP
    runs-on: ubuntu-latest
    environment: npm-production
    steps:
      - name: Check out the reviewed release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.7.0
          run_install: false

      - name: Install Node.js and configure npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate exact release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: pnpm exec tsx scripts/validate-package-release.ts

      - name: Run required source gates
        run: |
          pnpm dependencies:validate
          pnpm normalization:validate
          pnpm build
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm packages:smoke

      - name: Publish with public access and provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm --dir packages/sdk publish --access public --provenance --no-git-checks
          pnpm --dir packages/react publish --access public --provenance --no-git-checks
          pnpm --dir packages/mcp publish --access public --provenance --no-git-checks
