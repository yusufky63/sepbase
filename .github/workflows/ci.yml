name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_deployment_check:
        description: Verify the published deployment against its public RPC
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  application:
    name: Application and integration artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.7.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate exact dependency pins
        run: pnpm dependencies:validate

      - name: Validate ENSIP-15 normalization fixtures
        run: pnpm normalization:validate

      - name: Verify deterministic V3 draft manifest
        run: |
          pnpm manifest:v3:draft
          git diff --exit-code -- apps/web/public/deployment-manifest.v3.json

      - name: Validate project configuration
        run: pnpm project:validate

      - name: Validate integration artifacts
        run: pnpm exec tsx scripts/validate-integration-artifacts.ts

      - name: Build
        run: pnpm build

      - name: Smoke packed public packages from a clean consumer
        run: pnpm packages:smoke

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit --prod

  contracts:
    name: Foundry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.7.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@50d5a8956f2e319df19e6b57539d7e2acb9f8c1e # v1.5.0
        with:
          version: v1.7.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Solidity formatting
        run: pnpm contracts:fmt --check

      - name: Build contracts
        run: pnpm contracts:build

      - name: Validate V3 ABIs and release artifacts
        run: |
          pnpm contracts:abi:v3
          pnpm artifacts:v3:check
          git diff --exit-code -- apps/web/public/abi/v3 apps/web/lib/contract/v3-abi.generated.ts packages/sdk/src/v3-abi.generated.ts

      - name: Check contract sizes
        run: pnpm contracts:sizes

      - name: Test contracts
        run: pnpm contracts:test

  deployment:
    name: Published deployment
    if: ${{ vars.CI_DEPLOYMENT_CHECK == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_deployment_check) }}
    needs: [application, contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.7.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify contract and configuration against the public RPC
        run: pnpm deployment:check
