[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "../node_modules"]
solc_version = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
  { access = "read-write", path = "../deployments" },
  { access = "read", path = "../apps/web/public" }
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true

[profile.ci]
fuzz.runs = 1_000
invariant.runs = 256
invariant.depth = 128

[rpc_endpoints]
base_sepolia = "${ETH_RPC_URL}"
